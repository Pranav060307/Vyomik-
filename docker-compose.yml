# ==============================================================================
# VYOMIK E-Commerce Platform - Docker Compose Configuration
# Services: PostgreSQL 16, Redis 7, FastAPI Backend, React/Vite Frontend
# ==============================================================================

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vyomik_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vyomik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vyomik_secret_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-vyomik_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vyomik} -d ${POSTGRES_DB:-vyomik_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vyomik_network

  redis:
    image: redis:7-alpine
    container_name: vyomik_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vyomik_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vyomik_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - STORE_MODE=${STORE_MODE:-coming_soon}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vyomik}:${POSTGRES_PASSWORD:-vyomik_secret_dev_pass}@postgres:5432/${POSTGRES_DB:-vyomik_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-vyomik}:${POSTGRES_PASSWORD:-vyomik_secret_dev_pass}@postgres:5432/${POSTGRES_DB:-vyomik_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_change_in_production_min_32_chars_long}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      - PAYMENT_PROVIDER=mock
      - QIKINK_MODE=mock
    volumes:
      - ./backend:/app
    networks:
      - vyomik_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vyomik_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - vyomik_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  vyomik_network:
    driver: bridge
