<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <!-- Olive background as specified in reference design ("Hoodies is olive-highlighted") -->
  <rect width="600" height="700" fill="#5C6548"/>
  <rect x="20" y="20" width="560" height="660" fill="none" stroke="#727D5B" stroke-width="1"/>
  
  <!-- Silhouette of oversized hoodie -->
  <g transform="translate(100, 95)">
    <!-- Hood shape -->
    <path d="M 140,120 C 130,50 270,50 260,120 Z" fill="#4B533A" stroke="#3D442F" stroke-width="1.5"/>
    <path d="M 160,115 C 160,75 240,75 240,115 Z" fill="#3D442F"/>
    
    <!-- Heavyweight hoodie body with kangaroo pocket -->
    <path d="M 50,135 L 130,120 Q 200,135 270,120 L 350,135 L 375,320 L 315,335 L 305,240 L 310,430 L 90,430 L 95,240 L 85,335 L 25,320 Z" 
          fill="#4C533B" 
          stroke="#3D442F" 
          stroke-width="1.5"/>
          
    <!-- Kangaroo pocket outline -->
    <path d="M 140,320 L 260,320 L 275,395 L 125,395 Z" fill="#444C34" stroke="#373D29" stroke-width="1"/>
    
    <!-- Ribbed cuffs and hem -->
    <rect x="90" y="420" width="220" height="20" fill="#404730"/>
  </g>

  <!-- Typography in Ivory contrast -->
  <text x="50" y="580" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#DAD7CE" letter-spacing="3">CATEGORY 03 · FEATURED</text>
  <text x="50" y="615" font-family="'Inter', sans-serif" font-size="24" font-weight="600" fill="#F4F3EE" letter-spacing="-0.5">Oversized Hoodies</text>
  <text x="50" y="640" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#E6E4DE">450 GSM French Terry. Heavyweight comfort.</text>
</svg>
