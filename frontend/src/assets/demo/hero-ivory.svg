<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background with warm minimal tone -->
  <rect width="800" height="1000" fill="#EAE8E1"/>
  
  <defs>
    <linearGradient id="warmShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2DFD6"/>
      <stop offset="100%" stop-color="#D3CFBD"/>
    </linearGradient>
    <linearGradient id="ivoryFabric" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFBF9"/>
      <stop offset="60%" stop-color="#F4F3EE"/>
      <stop offset="100%" stop-color="#E7E5DC"/>
    </linearGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C59B7D"/>
      <stop offset="100%" stop-color="#AE8263"/>
    </linearGradient>
  </defs>

  <!-- Studio backdrop lighting effect -->
  <ellipse cx="400" cy="550" rx="350" ry="420" fill="url(#warmShadow)" opacity="0.6"/>

  <!-- Minimal Silhouette of Fashion Model -->
  <!-- Head & Neck -->
  <ellipse cx="400" cy="220" rx="60" ry="75" fill="url(#skinTone)"/>
  <rect x="375" y="270" width="50" height="70" fill="url(#skinTone)"/>

  <!-- Oversized Tee Silhouette (Ivory) -->
  <!-- Main Bodice & Sleeves -->
  <path d="M 220,340 
           L 320,330 
           Q 400,345 480,330 
           L 580,340 
           L 630,520 
           L 540,545 
           L 535,465 
           L 540,780 
           L 260,780 
           L 265,465 
           L 260,545 
           L 170,520 Z" 
        fill="url(#ivoryFabric)" 
        stroke="#DAD7CE" 
        stroke-width="1.5"/>

  <!-- Collar detail -->
  <path d="M 345,330 Q 400,360 455,330 Q 400,350 345,330" fill="#E6E4DD" stroke="#CDC9BA" stroke-width="1"/>

  <!-- Fabric fold shadows (editorial look) -->
  <path d="M 270,390 Q 320,440 330,580" stroke="#DFDCD2" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M 530,390 Q 480,440 470,580" stroke="#DFDCD2" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M 380,420 Q 400,530 395,740" stroke="#E3E0D6" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Lower Body / Silhouette Trousers -->
  <path d="M 275,780 L 390,780 L 385,1000 L 265,1000 Z" fill="#202020"/>
  <path d="M 410,780 L 525,780 L 535,1000 L 415,1000 Z" fill="#202020"/>

  <!-- Clean Editorial Demo Watermark / Badge -->
  <rect x="36" y="36" width="220" height="32" fill="#202020" opacity="0.85"/>
  <text x="48" y="57" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#F4F3EE" letter-spacing="1.5">DEMO · EDITORIAL (IVORY)</text>

  <!-- Spec annotation -->
  <text x="36" y="960" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#5C6548" letter-spacing="2">VYOMIK ESSENTIAL OVERSIZED TEE / IVORY</text>
  <text x="36" y="978" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="#727D5B">240 GSM COMBED COTTON · RELAXED DRAPE</text>
</svg>
