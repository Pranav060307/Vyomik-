 function doSignup(){var name=inp('name').value.trim(),email=inp('email').value.trim().toLowerCase(),pw=inp('password').value,cf=inp('confirm').value,ok=true;
  function chk(n,bad,m){setErr(inp(n),bad?m:'');if(bad)ok=false}
  chk('name',name.length<2,'Enter your full name');chk('email',!EMAIL.test(email),'Enter a valid email');
  chk('password',pw.length<6,'Use at least 6 characters');chk('confirm',!cf||pw!==cf,'Passwords do not match');
  if(!ok)return;
  if(!box.classList.contains('on')){toast('Please accept the Terms of Service and Privacy Policy');return}
  var users=jget('vyomik_users',[]);
  if(users.some(function(u){return u.email===email})){setErr(inp('email'),'An account with this email already exists');return}
  sha(pw).then(function(h){users.push({name:name,email:email,hash:h});jset('vyomik_users',users);setSession({name:name,email:email},true);
   toast('Account created. Welcome, '+name.split(' ')[0]+'!');setTimeout(function(){go(H)},1000)})}
 function doSignin(){var email=inp('email').value.trim().toLowerCase(),pw=inp('password').value,ok=true;
  setErr(inp('email'),EMAIL.test(email)?'':'Enter a valid email');setErr(inp('password'),pw?'':'Enter your password');
  if(!EMAIL.test(email)||!pw)return;
  var u=jget('vyomik_users',[]).filter(function(x){return x.email===email})[0];
  if(!u){setErr(inp('email'),'No account found. Create one first');return}
  sha(pw).then(function(h){if(h!==u.hash){setErr(inp('password'),'Wrong password');return}
